name: Bug Report
description: Create a report to help us improve zygote
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How do we reproduce this? Please attach a run zip bundle if applicable.
    validations:
      required: true
