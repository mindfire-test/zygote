repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: golangci-lint
  - repo: https://github.com/google/addlicense
    rev: v1.1.1
    hooks:
      - id: addlicense
        args:
          - -c
          - Mindfire
          - -l
          - apache
